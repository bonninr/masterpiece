name: build

# Actions minutes are metered on a private repository, and the rate differs
# sharply per platform: Linux counts 1x, Windows 2x, macOS 10x. The shape of
# this file follows from that -- see the macos job at the bottom.
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also build macOS (bills at 10x)'
        type: boolean
        default: false

# Pushing twice in a minute should not pay for two builds of the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-linux
            artifact: masterpiece-linux-x86_64
          - os: windows-latest
            preset: ci-windows
            artifact: masterpiece-windows
          - os: ubuntu-latest
            preset: ci-linux-arm
            artifact: masterpiece-linux-armhf
            arm: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # JUCE is recompiled from scratch otherwise, and it is the bulk of every
      # job. Keyed on the compiler and preset so a toolchain change does not
      # silently reuse objects built by a different one.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}-${{ matrix.os }}
          max-size: 500M

      - name: Dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev \
            libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libxi-dev

      - name: Dependencies (Linux -> ARM cross-build)
        if: runner.os == 'Linux' && matrix.arm
        run: |
          set -e
          CODENAME=$(awk -F= '$1=="UBUNTU_CODENAME" {print $2}' /etc/os-release)

          # Ubuntu 24.04 keeps its sources in deb822 files that declare no
          # Architectures. Adding armhf without pinning these first makes apt
          # ask the amd64-only mirror for armhf indexes and fail the update.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            grep -q '^Architectures:' "$f" || \
              sudo sed -i '/^Types: deb$/a Architectures: amd64' "$f"
          done

          # ARM lives on ports.ubuntu.com, including -security, for which
          # security.ubuntu.com answers 404.
          sudo tee /etc/apt/sources.list.d/armhf.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $CODENAME $CODENAME-updates $CODENAME-backports $CODENAME-security
          Components: main restricted universe multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo dpkg --add-architecture armhf
          sudo apt-get update

          # Package names are gcc-<triple>, not <triple>-gcc; the latter is the
          # binary name and matches no package.
          sudo apt-get install -y cmake ninja-build pkg-config \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf \
            libasound2-dev:armhf libx11-dev:armhf libxrandr-dev:armhf \
            libxinerama-dev:armhf libxcursor-dev:armhf libxcomposite-dev:armhf \
            libfreetype6-dev:armhf libfontconfig1-dev:armhf \
            libglu1-mesa-dev:armhf libxi-dev:armhf
          arm-linux-gnueabihf-g++ --version

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # A cross-built binary cannot run here, so confirm its machine type.
      - name: Check ARM output
        if: matrix.arm
        run: file build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Masterpiece

      - name: Launch check (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get install -y xvfb
          APP=build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Masterpiece
          chmod +x "$APP"
          set +e
          timeout --signal=TERM 20s xvfb-run -a -s "-screen 0 1280x800x24" "$APP"
          code=$?
          set -e
          # 124 is the timeout firing, which means it was still running.
          test "$code" -eq 124

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.exe"
          if (-not (Test-Path $app)) { throw "not built: $app" }
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/**/*Masterpiece*
            build/${{ matrix.preset }}/apps/MasterpiecePlugin/**/*.vst3
            build/${{ matrix.preset }}/apps/MasterpiecePlugin/**/*.lv2
          if-no-files-found: warn

  # Separate, and off by default. A macOS runner bills ten minutes of the
  # allowance for every minute it runs -- more than the Linux and Windows jobs
  # put together. Run it deliberately: on a release tag, or by hand from the
  # Actions tab with the macos input ticked.
  macos:
    if: startsWith(github.ref, 'refs/tags/') || inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-macos-macos-latest
          max-size: 500M

      - name: Dependencies
        run: brew install cmake ninja

      - name: Configure
        run: >
          cmake --preset ci-macos
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ci-macos

      - uses: actions/upload-artifact@v4
        with:
          name: masterpiece-macos
          path: |
            build/ci-macos/apps/MasterpieceApp/MasterpieceApp_artefacts/**/*Masterpiece*
            build/ci-macos/apps/MasterpiecePlugin/**/*.vst3
            build/ci-macos/apps/MasterpiecePlugin/**/*.component
          if-no-files-found: warn
