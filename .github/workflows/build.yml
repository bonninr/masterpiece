name: build

# Six targets, all of them things a player might actually run this on:
# Windows, Linux x86-64, a Raspberry Pi in either 64-bit (the default since
# 2022) or 32-bit form, and macOS on both Apple silicon and Intel. The two
# Macs are built natively and shipped separately, as GrandOrgue does, rather
# than as one universal binary.
#
# On a public repository the standard runners cost nothing, so this no longer
# has to be shaped around a minute allowance; it is still kept from doing
# obviously wasted work, because a queue is a cost of its own.
on:
  # Main only: a branch with a pull request is built for the pull request,
  # and building it for the push as well doubled every run, its artifacts and
  # its caches until the account's Actions storage was full. Tags are built by
  # release.yml.
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:
  # release.yml calls this rather than repeating the matrix, so a tagged
  # release is built by exactly the same steps as an ordinary push.
  workflow_call:

# Pushing twice in a minute should not pay for two builds of the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a binary needs the glibc it was built
          # against or newer, and 24.04's (2.39) is newer than Debian 12 and
          # Raspberry Pi OS (2.36) have. Built here, the packages run on both.
          - os: ubuntu-22.04
            preset: ci-linux
            artifact: masterpiece-linux-x86_64
          - os: windows-latest
            preset: ci-windows
            artifact: masterpiece-windows
          # The Pi, both ways round. arm64 is what a current Raspberry Pi OS
          # install actually is; armhf stays for older 32-bit installs.
          - os: ubuntu-22.04
            preset: ci-linux-arm64
            artifact: masterpiece-linux-arm64
            arm: true
            debarch: arm64
            triple: aarch64-linux-gnu
          - os: ubuntu-22.04
            preset: ci-linux-arm
            artifact: masterpiece-linux-armhf
            arm: true
            debarch: armhf
            triple: arm-linux-gnueabihf
          # Both Macs, each built on its own architecture. The Intel build
          # names the oldest macOS it must run on; the Apple-silicon one
          # cannot predate the hardware, so it takes the toolchain default.
          - os: macos-14
            preset: ci-macos
            artifact: masterpiece-macos-arm64
            mac: true
            macarch: arm64
          - os: macos-15-intel
            preset: ci-macos
            artifact: masterpiece-macos-x86_64
            mac: true
            macarch: x86_64
            cmake_extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=12.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # JUCE is recompiled from scratch otherwise, and it is the bulk of every
      # job. Keyed on the compiler and preset so a toolchain change does not
      # silently reuse objects built by a different one.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}-${{ matrix.os }}
          max-size: 500M
          # Saved from main only; pull requests restore main's. Every run
          # saving its own filled the 10 GB cache allowance in a day.
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev \
            libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libxi-dev \
            libjack-jackd2-dev

      # In a script rather than inline, so the setup this job depends on can be
      # rehearsed off the runner. These two jobs produce a binary that cannot
      # be run here to check, which makes being able to reproduce them locally
      # worth more than it is for the native ones.
      - name: Dependencies (Linux -> ARM cross-build)
        if: runner.os == 'Linux' && matrix.arm
        # Invoked through bash rather than directly: the repository is worked
        # on from Windows, where the executable bit is not reliably carried.
        run: bash cmake/ci-arm-multiarch.sh ${{ matrix.debarch }} ${{ matrix.triple }}

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The suite needs no sample library and runs in about a second, so every
      # target that can execute its own build runs it. The cross-built ARM jobs
      # cannot, and are covered by the package tests in their own containers.
      - name: Tests
        if: '!matrix.arm'
        shell: bash
        run: |
          TESTS=$(find build/${{ matrix.preset }}/tests -name 'mp_tests*' -type f | head -1)
          test -n "$TESTS" || { echo "the test suite was not built"; exit 1; }
          "$TESTS" --no-perf

      # A cross-built binary cannot run here, so confirm its machine type
      # instead -- and confirm it is the RIGHT machine type, because a
      # toolchain that silently fell back to the host compiler would otherwise
      # produce a green x86 build labelled as the Pi one.
      - name: Check ARM output
        if: matrix.arm
        run: |
          APP=$(find build/${{ matrix.preset }}/apps/MasterpieceApp -name Masterpiece -type f | head -1)
          test -n "$APP" || { echo "no binary was produced"; exit 1; }
          file "$APP"
          file "$APP" | grep -q "${{ matrix.debarch == 'arm64' && 'ARM aarch64' || 'ARM, EABI' }}"

      - name: Launch check (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get install -y xvfb
          # Located rather than spelled out: JUCE puts artefacts under a
          # per-configuration subdirectory, so the path carries a Release/
          # that is easy to leave out and gives "no such file" when you do.
          APP=$(find build/${{ matrix.preset }}/apps/MasterpieceApp -name Masterpiece -type f | head -1)
          test -n "$APP" || { echo "no binary was produced"; exit 1; }
          chmod +x "$APP"
          set +e
          timeout --signal=TERM 20s xvfb-run -a -s "-screen 0 1280x800x24" "$APP"
          code=$?
          set -e
          # 124 is the timeout firing, which means it was still running.
          test "$code" -eq 124

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.exe"
          if (-not (Test-Path $app)) { throw "not built: $app" }
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      # Same check the other native targets get, plus the machine type: two
      # Mac jobs differing only in the runner would otherwise be impossible to
      # tell apart from their artefacts.
      - name: Launch check (macOS)
        if: matrix.mac
        run: |
          APP=build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.app
          BIN="$APP/Contents/MacOS/Masterpiece"
          test -x "$BIN" || { echo "no binary was produced"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.macarch }}"
          "$BIN" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "exited early"; exit 1; }
          kill "$pid"

      # Packed on the Mac itself: uploading a .app as loose files loses the
      # executable bit, and an app bundle that cannot be executed is not an
      # app. ditto is the tool that keeps a bundle intact through a zip.
      - name: Package (macOS)
        if: matrix.mac
        run: |
          stage=$(mktemp -d)/Masterpiece
          mkdir -p "$stage"
          cp -R build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.app "$stage/"
          for f in AU/Masterpiece.component VST3/Masterpiece.vst3; do
            src=build/${{ matrix.preset }}/apps/MasterpiecePlugin/MasterpiecePlugin_artefacts/Release/$f
            [ -e "$src" ] && cp -R "$src" "$stage/"
          done
          mkdir -p dist
          ditto -c -k --keepParent "$stage" "dist/${{ matrix.artifact }}.zip"
          ls -lh dist

      # ---- Installers -------------------------------------------------------
      # The setup program and the .deb are built by CPack from the same install
      # rules (cmake/Packaging.cmake), then installed on this runner exactly as a
      # player would install them, and checked: installed where expected,
      # nothing extra packed, the installed program starts, and it uninstalls
      # clean. A package that is only built is a package nobody has tried.

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # makensis ships with the runner image; install it if it ever stops.
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis --no-progress -y }
          $env:PATH = "$nsis;$env:PATH"
          # By full path: on this runner a bare "cpack" is Chocolatey's.
          $cpack = Join-Path (Split-Path (Get-Command cmake).Source) "cpack.exe"
          Push-Location "build/${{ matrix.preset }}"
          & $cpack -G NSIS
          if ($LASTEXITCODE -ne 0) { Get-Content _CPack_Packages/*/NSIS/NSISOutput.log -EA SilentlyContinue | Select-Object -Last 40; throw "cpack failed" }
          Pop-Location
          $setup = "build/${{ matrix.preset }}/masterpiece-windows-setup.exe"
          if (-not (Test-Path $setup)) { throw "no installer was produced" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup dist/
          Get-Item dist/masterpiece-windows-setup.exe | Format-Table Name, Length

      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "Masterpiece"
          $key  = 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Masterpiece'
          # Every place the shortcut may legitimately be: for all users or
          # just this one, and in a folder of its own or directly under
          # Programs -- a silent install has no page to choose a folder on.
          $menus = @()
          foreach ($root in "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
                            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs") {
            $menus += $root
            $menus += "$root\Masterpiece"
          }
          $i = Start-Process dist/masterpiece-windows-setup.exe -ArgumentList "/S", "/D=$dest" -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "silent install exited $($i.ExitCode)" }

          $files = Get-ChildItem $dest -Recurse -File | ForEach-Object { $_.FullName.Substring($dest.Length + 1) } | Sort-Object
          $files | ForEach-Object { Write-Host "  installed: $_" }
          $expected = @("bin\Masterpiece.exe", "Uninstall.exe")
          if (Compare-Object $files $expected) { throw "installed files differ from: $($expected -join ', ')" }
          if (-not (Test-Path $key)) { throw "not registered for Add/Remove Programs" }
          $shortcuts = $menus | Where-Object { Test-Path "$_\Masterpiece.lnk" }
          if (-not $shortcuts) { throw "no Start menu shortcut in either menu" }
          $shortcuts | ForEach-Object { Write-Host "  shortcut: $_" }

          $p = Start-Process (Join-Path $dest "bin\Masterpiece.exe") -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "installed program exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2

          $u = Start-Process (Join-Path $dest "Uninstall.exe") -ArgumentList "/S" -PassThru -Wait
          # The uninstaller copies itself away and returns before it is done.
          for ($n = 0; $n -lt 60 -and ((Test-Path "$dest\bin\Masterpiece.exe") -or (Test-Path $key)); $n++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          if (Test-Path "$dest\bin\Masterpiece.exe") { throw "uninstall left the program behind" }
          if (Test-Path $key) { throw "uninstall left the registry entry behind" }
          $left = $menus | Where-Object { Test-Path "$_\Masterpiece.lnk" }
          if ($left) { throw "uninstall left the Start menu shortcut behind: $left" }
          Write-Host "install, launch and uninstall all clean"

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          (cd build/${{ matrix.preset }} && cpack -G DEB)
          DEB=$(ls build/${{ matrix.preset }}/masterpiece-linux-*.deb)
          mkdir -p dist && cp "$DEB" dist/
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          # The binary inside must be the target's, not the build machine's.
          tmp=$(mktemp -d) && dpkg-deb -x "$DEB" "$tmp"
          file "$tmp/usr/bin/masterpiece"
          test -x "$tmp/usr/bin/masterpiece"
          test -f "$tmp/usr/share/applications/masterpiece.desktop"
          test -f "$tmp/usr/share/icons/hicolor/256x256/apps/masterpiece.png"

      # The ARM packages are installed in an emulated container of their own
      # architecture, which is the only honest test of their dependency list.
      - name: Emulation for the ARM package test
        if: runner.os == 'Linux' && matrix.arm
        uses: docker/setup-qemu-action@v3

      - name: Package test (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          DEB=$(basename dist/masterpiece-linux-*.deb)
          case "${{ matrix.debarch }}" in
            arm64) platform=linux/arm64 ;;
            armhf) platform=linux/arm/v7 ;;
            *)     platform=linux/amd64 ;;
          esac
          # Both library namings: Debian 12 before the t64 renames, Ubuntu 24.04 after.
          for image in debian:12 ubuntu:24.04; do
            echo "== $image ($platform)"
            docker run --rm --platform "$platform" -v "$PWD/dist:/pkg" "$image" bash -ec "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkg/$DEB >/dev/null
              test -x /usr/bin/masterpiece
              if ldd /usr/bin/masterpiece | grep 'not found'; then exit 1; fi
              apt-get remove -y -qq masterpiece >/dev/null
              test ! -e /usr/bin/masterpiece
              echo 'installs, resolves every library, removes clean'
            "
          done

      # A native package can also be started once installed. Only here: the
      # emulated ARM containers would take many minutes to draw a window.
      - name: Package launch check (Linux .deb)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          DEB=$(basename dist/masterpiece-linux-*.deb)
          docker run --rm -v "$PWD/dist:/pkg" ubuntu:24.04 bash -ec "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /pkg/$DEB xvfb xauth >/dev/null
            set +e
            timeout --signal=TERM 20s xvfb-run -a -s '-screen 0 1280x800x24' masterpiece
            code=\$?
            set -e
            echo \"exit \$code\"
            test \"\$code\" -eq 124
          "

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: masterpiece-windows-setup
          path: dist/masterpiece-windows-setup.exe
          if-no-files-found: error
          # A CI build is worth keeping only until someone has looked at it.
          # The default is 90 days, and at a few hundred megabytes a run that
          # fills the account's storage on its own.
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.artifact }}-deb
          path: dist/masterpiece-linux-*.deb
          if-no-files-found: error
          # A CI build is worth keeping only until someone has looked at it.
          # The default is 90 days, and at a few hundred megabytes a run that
          # fills the account's storage on its own.
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: matrix.mac
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          # A CI build is worth keeping only until someone has looked at it.
          # The default is 90 days, and at a few hundred megabytes a run that
          # fills the account's storage on its own.
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: '!matrix.mac'
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/**/*Masterpiece*
            build/${{ matrix.preset }}/apps/MasterpiecePlugin/**/*.vst3
            build/${{ matrix.preset }}/apps/MasterpiecePlugin/**/*.lv2
          if-no-files-found: warn
          retention-days: 3

  # iOS: the app for the simulator, unsigned. No release ships it yet, so a
  # tagged release skips it; on pull requests it keeps the iOS build honest.
  ios:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ios-sim

      - name: Build
        run: >
          cmake --build build/ios-sim --config Release --target MasterpieceApp --
          -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO

      - name: Check output
        run: |
          APP=$(find build/ios-sim -name Masterpiece.app -type d | head -1)
          test -n "$APP" || { echo "no Masterpiece.app"; exit 1; }
          echo "$APP"
          lipo -info "$APP/Masterpiece"
          plutil -p "$APP/Info.plist" | grep -E "UIFileSharingEnabled|UIBackgroundModes|LSSupportsOpeningDocumentsInPlace" || true
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Run it, since nobody here has a Mac to look with: an iPad simulator,
      # an organ made on the spot (one stop of sine-wave pipes) played from a
      # MIDI file and recorded inside the app, the recording checked for
      # sound and pitch, then the UI tapped through by the names on its
      # buttons. Everything seen is kept in the ios-simulator-screenshots
      # artifact. The checks report; they do not fail the build yet.
      # idb taps the UI. Without it the organ is still played and checked;
      # only the tap-through is lost, so this step may fail.
      - name: Tools for the simulator run
        continue-on-error: true
        run: |
          brew tap facebook/fb
          # Homebrew installs from a tap only once it is trusted; this one is
          # Meta's own, the documented way to install idb.
          brew trust facebook/fb || true
          brew install idb-companion
          pip3 install --break-system-packages fb-idb numpy || pip3 install fb-idb numpy

      - name: Run in the simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j |
            python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPad' in x['name']))")
          echo "simulator: $DEVICE"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p ios-shots

          # The organ, in the app's own Documents folder, where it may read;
          # played from its package, as a phone or tablet opens organs.
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          python3 .github/ios-check/make_organ.py "$DATA/Documents/check"
          ls "$DATA/Documents/check" | head

          xcrun simctl launch "$DEVICE" "$BUNDLE"             --odf "$DATA/Documents/check/check.orgue" --draw-stops all             --play-midi "$DATA/Documents/check/check.mid"             --record-audio "$DATA/Documents/check/out.wav"             --log "$DATA/Documents/check/run.log" --stay-open | tee ios-shots/launch.txt

          # The piece lasts about five seconds once the organ is up.
          for i in $(seq 1 60); do
            grep -q "recital finished" "$DATA/Documents/check/run.log" 2>/dev/null && break
            sleep 2
          done
          cp "$DATA/Documents/check/run.log" ios-shots/ 2>/dev/null || echo "no log" > ios-shots/run.log
          xcrun simctl io "$DEVICE" screenshot ios-shots/00-after-playing.png
          if [ -f "$DATA/Documents/check/out.wav" ]; then
            cp "$DATA/Documents/check/out.wav" ios-shots/
            python3 .github/ios-check/check_audio.py ios-shots/out.wav | tee ios-shots/audio-result.txt || true
          else
            echo "FAIL: no recording" | tee ios-shots/audio-result.txt
          fi

          python3 .github/ios-check/drive_ui.py "$DEVICE" ios-shots/ui || true

          # Still running, or did it crash?
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i "$BUNDLE" | tee ios-shots/running.txt || echo "NOT RUNNING" | tee ios-shots/running.txt
          xcrun simctl spawn "$DEVICE" log show --last 5m --predicate "process == 'Masterpiece'" --style compact > ios-shots/system-log.txt 2>&1 || true
          find ~/Library/Logs/DiagnosticReports -name "Masterpiece*" -newer "$APP" -exec cp {} ios-shots/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios-shots/
          if-no-files-found: warn
          retention-days: 3
