name: build

# Six targets, all of them things a player might actually run this on:
# Windows, Linux x86-64, a Raspberry Pi in either 64-bit (the default since
# 2022) or 32-bit form, and macOS on both Apple silicon and Intel. The two
# Macs are built natively and shipped separately, as GrandOrgue does, rather
# than as one universal binary.
#
# On a public repository the standard runners cost nothing, so this no longer
# has to be shaped around a minute allowance; it is still kept from doing
# obviously wasted work, because a queue is a cost of its own.
on:
  # Main only: a branch with a pull request is built for the pull request,
  # and building it for the push as well doubled every run, its artifacts and
  # its caches until the account's Actions storage was full. Tags are built by
  # release.yml.
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
      # The project page builds nothing; pages.yml publishes it.
      - 'site/**'
      - 'manual/**'
      - 'ATTRIBUTION.md'
      - '.github/pages-downloads.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
      - 'site/**'
      - 'manual/**'
      - 'ATTRIBUTION.md'
      - '.github/pages-downloads.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # release.yml calls this rather than repeating the matrix, so a tagged
  # release is built by exactly the same steps as an ordinary push.
  workflow_call:

# Pushing twice in a minute should not pay for two builds of the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a binary needs the glibc it was built
          # against or newer, and 24.04's (2.39) is newer than Debian 12 and
          # Raspberry Pi OS (2.36) have. Built here, the packages run on both.
          - os: ubuntu-22.04
            preset: ci-linux
            artifact: masterpiece-linux-x86_64
          - os: windows-latest
            preset: ci-windows
            artifact: masterpiece-windows
          # The Pi, both ways round. arm64 is what a current Raspberry Pi OS
          # install actually is; armhf stays for older 32-bit installs.
          - os: ubuntu-22.04
            preset: ci-linux-arm64
            artifact: masterpiece-linux-arm64
            arm: true
            debarch: arm64
            triple: aarch64-linux-gnu
          - os: ubuntu-22.04
            preset: ci-linux-arm
            artifact: masterpiece-linux-armhf
            arm: true
            debarch: armhf
            triple: arm-linux-gnueabihf
          # Both Macs, each naming the oldest macOS it runs on. Left to the
          # toolchain, the Apple-silicon build took the build machine's own
          # macOS (14) and would not open on an M1 still on Big Sur, Monterey
          # or Ventura. 11.0 is the first macOS on Apple silicon; 10.15 is the
          # first with std::filesystem.
          #
          # Both are built on an Apple-silicon runner. The Intel runners are
          # few, and a job waited a quarter of an hour or more for one on
          # every run, a release included. The Intel build is compiled for
          # x86_64 here and its tests and its launch run under Rosetta, which
          # is also how a good share of its players run it.
          - os: macos-14
            preset: ci-macos
            artifact: masterpiece-macos-arm64
            mac: true
            macarch: arm64
            cmake_extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: macos-14
            preset: ci-macos
            artifact: masterpiece-macos-x86_64
            mac: true
            macarch: x86_64
            cmake_extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # JUCE is recompiled from scratch otherwise, and it is the bulk of every
      # job. Keyed on the compiler and preset so a toolchain change does not
      # silently reuse objects built by a different one.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # The architecture too, now that both Macs build on one runner.
          key: ${{ matrix.preset }}-${{ matrix.os }}${{ matrix.macarch && format('-{0}', matrix.macarch) || '' }}
          # Room for one whole build. At 500M the Windows build (about 600M)
          # pushed its own objects out as it went: 361 cleanups and 47% hits
          # on a main run restored from the run before it.
          max-size: ${{ runner.os == 'Windows' && '1500M' || '1000M' }}
          # What the build did not touch is dropped before the save, so the
          # cache holds this build and nothing older, and stays its size.
          evict-old-files: job
          # Saved from main only; pull requests restore main's. Every run
          # saving its own filled the 10 GB cache allowance in a day.
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Verovio (the score panel's engraver) in a compiler cache of its own,
      # kept until its tag or its build file changes: the cache above is full
      # with JUCE and the program, and Verovio is as large again.
      - name: Verovio compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache-verovio
          key: verovio-${{ matrix.preset }}-${{ matrix.os }}${{ matrix.macarch && format('-{0}', matrix.macarch) || '' }}-${{ hashFiles('cmake/MpVerovio.cmake', 'cmake/MpVerovioStubs.cpp') }}

      - name: Dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev \
            libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libxi-dev \
            libjack-jackd2-dev python3-yaml fonts-dejavu-core

      # The control protocol's code and API description are generated from
      # protocol/control.yaml and committed; a change to one without the
      # others fails here.
      - name: Control protocol is current
        if: runner.os == 'Linux' && !matrix.arm
        run: python3 tools/gen-protocol.py --check

      # In a script rather than inline, so the setup this job depends on can be
      # rehearsed off the runner. These two jobs produce a binary that cannot
      # be run here to check, which makes being able to reproduce them locally
      # worth more than it is for the native ones.
      - name: Dependencies (Linux -> ARM cross-build)
        if: runner.os == 'Linux' && matrix.arm
        # Invoked through bash rather than directly: the repository is worked
        # on from Windows, where the executable bit is not reliably carried.
        run: bash cmake/ci-arm-multiarch.sh ${{ matrix.debarch }} ${{ matrix.triple }}

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          # For the Intel build's tests and launch; already there on most
          # images, and a no-op then.
          if [ "${{ matrix.macarch }}" = "x86_64" ]; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The program and the test suite. The plugins build in the plugins job
      # below, on a runner of their own, so their link-time optimised links
      # no longer wait in line behind the program's.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DMP_BUILD_PLUGIN=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DMP_VEROVIO_CCACHE_DIR=${{ github.workspace }}/.ccache-verovio"
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The suite needs no sample library and runs in about a second, so every
      # target that can execute its own build runs it. The cross-built ARM jobs
      # cannot, and are covered by the package tests in their own containers.
      - name: Tests
        if: '!matrix.arm'
        shell: bash
        run: |
          TESTS=$(find build/${{ matrix.preset }}/tests -name 'mp_tests*' -type f | head -1)
          test -n "$TESTS" || { echo "the test suite was not built"; exit 1; }
          "$TESTS" --no-perf

      # A cross-built binary cannot run here, so confirm its machine type
      # instead -- and confirm it is the RIGHT machine type, because a
      # toolchain that silently fell back to the host compiler would otherwise
      # produce a green x86 build labelled as the Pi one.
      - name: Check ARM output
        if: matrix.arm
        run: |
          APP=$(find build/${{ matrix.preset }}/apps/MasterpieceApp -name Masterpiece -type f | head -1)
          test -n "$APP" || { echo "no binary was produced"; exit 1; }
          file "$APP"
          file "$APP" | grep -q "${{ matrix.debarch == 'arm64' && 'ARM aarch64' || 'ARM, EABI' }}"

      - name: Launch check (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get install -y xvfb
          # Located rather than spelled out: JUCE puts artefacts under a
          # per-configuration subdirectory, so the path carries a Release/
          # that is easy to leave out and gives "no such file" when you do.
          APP=$(find build/${{ matrix.preset }}/apps/MasterpieceApp -name Masterpiece -type f | head -1)
          test -n "$APP" || { echo "no binary was produced"; exit 1; }
          chmod +x "$APP"
          set +e
          timeout --signal=TERM 20s xvfb-run -a -s "-screen 0 1280x800x24" "$APP"
          code=$?
          set -e
          # 124 is the timeout firing, which means it was still running.
          test "$code" -eq 124

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.exe"
          if (-not (Test-Path $app)) { throw "not built: $app" }
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      # Same check the other native targets get, plus the machine type: two
      # Mac jobs differing only in the runner would otherwise be impossible to
      # tell apart from their artefacts.
      - name: Launch check (macOS)
        if: matrix.mac
        run: |
          APP=build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.app
          BIN="$APP/Contents/MacOS/Masterpiece"
          test -x "$BIN" || { echo "no binary was produced"; exit 1; }
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.macarch }}"
          # The oldest macOS the app opens on, as the binary says it: it must
          # be the one the job names, never the build machine's own.
          want=$(echo "${{ matrix.cmake_extra }}" | sed -n 's/.*DEPLOYMENT_TARGET=\([0-9.]*\).*/\1/p')
          got=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
          echo "oldest macOS: $got (wanted $want)"
          [ -z "$want" ] || [ "$got" = "$want" ] || { echo "the binary asks for macOS $got"; exit 1; }
          # The "Bluetooth MIDI" button ends an app without this key (#563).
          plutil -p "$APP/Contents/Info.plist" | grep NSBluetoothAlwaysUsageDescription || { echo "no Bluetooth usage description"; exit 1; }
          "$BIN" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "exited early"; exit 1; }
          kill "$pid"

      # Packed on the Mac itself: uploading a .app as loose files loses the
      # executable bit, and an app bundle that cannot be executed is not an
      # app. ditto is the tool that keeps a bundle intact through a zip.
      - name: Package (macOS)
        if: matrix.mac
        run: |
          stage=$(mktemp -d)/Masterpiece
          mkdir -p "$stage"
          cp -R build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.app "$stage/"
          mkdir -p dist
          ditto -c -k --keepParent "$stage" "dist/${{ matrix.artifact }}.zip"
          ls -lh dist

      # ---- Installers -------------------------------------------------------
      # The setup program and the .deb are built by CPack from the same install
      # rules (cmake/Packaging.cmake), then installed on this runner exactly as a
      # player would install them, and checked: installed where expected,
      # nothing extra packed, the installed program starts, and it uninstalls
      # clean. A package that is only built is a package nobody has tried.

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # makensis ships with the runner image; install it if it ever stops.
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis --no-progress -y }
          $env:PATH = "$nsis;$env:PATH"
          # By full path: on this runner a bare "cpack" is Chocolatey's.
          $cpack = Join-Path (Split-Path (Get-Command cmake).Source) "cpack.exe"
          Push-Location "build/${{ matrix.preset }}"
          & $cpack -G NSIS
          if ($LASTEXITCODE -ne 0) { Get-Content _CPack_Packages/*/NSIS/NSISOutput.log -EA SilentlyContinue | Select-Object -Last 40; throw "cpack failed" }
          Pop-Location
          $setup = "build/${{ matrix.preset }}/masterpiece-windows-setup.exe"
          if (-not (Test-Path $setup)) { throw "no installer was produced" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup dist/
          Get-Item dist/masterpiece-windows-setup.exe | Format-Table Name, Length

      - name: Installer test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "Masterpiece"
          $key  = 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Masterpiece'
          # Every place the shortcut may legitimately be: for all users or
          # just this one, and in a folder of its own or directly under
          # Programs -- a silent install has no page to choose a folder on.
          $menus = @()
          foreach ($root in "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
                            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs") {
            $menus += $root
            $menus += "$root\Masterpiece"
          }
          $i = Start-Process dist/masterpiece-windows-setup.exe -ArgumentList "/S", "/D=$dest" -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "silent install exited $($i.ExitCode)" }

          $files = Get-ChildItem $dest -Recurse -File | ForEach-Object { $_.FullName.Substring($dest.Length + 1) } | Sort-Object
          $files | ForEach-Object { Write-Host "  installed: $_" }
          $expected = @("bin\Masterpiece.exe", "Uninstall.exe")
          if (Compare-Object $files $expected) { throw "installed files differ from: $($expected -join ', ')" }
          if (-not (Test-Path $key)) { throw "not registered for Add/Remove Programs" }
          $shortcuts = $menus | Where-Object { Test-Path "$_\Masterpiece.lnk" }
          if (-not $shortcuts) { throw "no Start menu shortcut in either menu" }
          $shortcuts | ForEach-Object { Write-Host "  shortcut: $_" }

          $p = Start-Process (Join-Path $dest "bin\Masterpiece.exe") -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "installed program exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2

          $u = Start-Process (Join-Path $dest "Uninstall.exe") -ArgumentList "/S" -PassThru -Wait
          # The uninstaller copies itself away and returns before it is done.
          for ($n = 0; $n -lt 60 -and ((Test-Path "$dest\bin\Masterpiece.exe") -or (Test-Path $key)); $n++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          if (Test-Path "$dest\bin\Masterpiece.exe") { throw "uninstall left the program behind" }
          if (Test-Path $key) { throw "uninstall left the registry entry behind" }
          $left = $menus | Where-Object { Test-Path "$_\Masterpiece.lnk" }
          if ($left) { throw "uninstall left the Start menu shortcut behind: $left" }
          Write-Host "install, launch and uninstall all clean"

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          (cd build/${{ matrix.preset }} && cpack -G DEB)
          DEB=$(ls build/${{ matrix.preset }}/masterpiece-linux-*.deb)
          mkdir -p dist && cp "$DEB" dist/
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          # The binary inside must be the target's, not the build machine's.
          tmp=$(mktemp -d) && dpkg-deb -x "$DEB" "$tmp"
          file "$tmp/usr/bin/masterpiece"
          test -x "$tmp/usr/bin/masterpiece"
          test -f "$tmp/usr/share/applications/masterpiece.desktop"
          test -f "$tmp/usr/share/icons/hicolor/256x256/apps/masterpiece.png"

      # The ARM packages are installed in an emulated container of their own
      # architecture, which is the only honest test of their dependency list.
      - name: Emulation for the ARM package test
        if: runner.os == 'Linux' && matrix.arm
        uses: docker/setup-qemu-action@v3

      - name: Package test (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          DEB=$(basename dist/masterpiece-linux-*.deb)
          case "${{ matrix.debarch }}" in
            arm64) platform=linux/arm64 ;;
            armhf) platform=linux/arm/v7 ;;
            *)     platform=linux/amd64 ;;
          esac
          # Both library namings: Debian 12 before the t64 renames, Ubuntu 24.04 after.
          for image in debian:12 ubuntu:24.04; do
            echo "== $image ($platform)"
            docker run --rm --platform "$platform" -v "$PWD/dist:/pkg" "$image" bash -ec "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkg/$DEB >/dev/null
              test -x /usr/bin/masterpiece
              if ldd /usr/bin/masterpiece | grep 'not found'; then exit 1; fi
              apt-get remove -y -qq masterpiece >/dev/null
              test ! -e /usr/bin/masterpiece
              echo 'installs, resolves every library, removes clean'
            "
          done

      # A native package can also be started once installed. Only here: the
      # emulated ARM containers would take many minutes to draw a window.
      - name: Package launch check (Linux .deb)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          DEB=$(basename dist/masterpiece-linux-*.deb)
          docker run --rm -v "$PWD/dist:/pkg" ubuntu:24.04 bash -ec "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /pkg/$DEB xvfb xauth >/dev/null
            set +e
            timeout --signal=TERM 20s xvfb-run -a -s '-screen 0 1280x800x24' masterpiece
            code=\$?
            set -e
            echo \"exit \$code\"
            test \"\$code\" -eq 124
          "

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: masterpiece-windows-setup
          path: dist/masterpiece-windows-setup.exe
          if-no-files-found: error
          # A CI build is worth keeping only until someone has looked at it.
          # The default is 90 days, and at a few hundred megabytes a run that
          # fills the account's storage on its own.
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.artifact }}-deb
          path: dist/masterpiece-linux-*.deb
          if-no-files-found: error
          # A CI build is worth keeping only until someone has looked at it.
          # The default is 90 days, and at a few hundred megabytes a run that
          # fills the account's storage on its own.
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: matrix.mac
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          # A CI build is worth keeping only until someone has looked at it.
          # The default is 90 days, and at a few hundred megabytes a run that
          # fills the account's storage on its own.
          retention-days: 3

      # The Windows zip and the Linux tarballs as one folder, the way the Mac
      # zip is. The plugins have packages of their own (the plugins job).
      - name: Package (Windows and Linux)
        if: '!matrix.mac'
        shell: bash
        run: |
          apps=build/${{ matrix.preset }}/apps
          stage=dist/portable/Masterpiece
          mkdir -p "$stage"
          for f in Masterpiece.exe Masterpiece; do
            src=$apps/MasterpieceApp/MasterpieceApp_artefacts/Release/$f
            if [ -f "$src" ]; then cp "$src" "$stage/"; fi
          done
          find dist/portable -maxdepth 3 | sort
          ls "$stage"/Masterpiece* > /dev/null

      - uses: actions/upload-artifact@v4
        if: '!matrix.mac'
        with:
          name: ${{ matrix.artifact }}
          path: dist/portable/
          if-no-files-found: error
          retention-days: 3

  # The plugins, in jobs and packages of their own: VST3 and LV2 on Windows and
  # Linux, VST3 and the Audio Unit on both Macs. Built beside the program on
  # one runner, their link-time optimised links queued behind the program's
  # and made the desktop jobs the slowest of every run. The Raspberry Pi
  # builds have no plugins.
  #
  # Each restores the compiler cache of the desktop job for its platform and
  # saves none: the organ libraries compile the same for both, and a cache of
  # their own per job would not fit in the repository's cache allowance.
  plugins:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: ci-linux
            artifact: masterpiece-plugins-linux-x86_64
          - os: windows-latest
            preset: ci-windows
            artifact: masterpiece-plugins-windows
          - os: macos-14
            preset: ci-macos
            artifact: masterpiece-plugins-macos-arm64
            mac: true
            macarch: arm64
            cmake_extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: macos-14
            preset: ci-macos
            artifact: masterpiece-plugins-macos-x86_64
            mac: true
            macarch: x86_64
            cmake_extra: -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # The desktop job's key, so this job starts from its cache.
          key: ${{ matrix.preset }}-${{ matrix.os }}${{ matrix.macarch && format('-{0}', matrix.macarch) || '' }}
          max-size: ${{ runner.os == 'Windows' && '1500M' || '1000M' }}
          save: false

      - name: Verovio compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache-verovio
          key: verovio-${{ matrix.preset }}-${{ matrix.os }}${{ matrix.macarch && format('-{0}', matrix.macarch) || '' }}-${{ hashFiles('cmake/MpVerovio.cmake', 'cmake/MpVerovioStubs.cpp') }}

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev \
            libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libxi-dev \
            libjack-jackd2-dev fonts-dejavu-core

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DMP_BUILD_STANDALONE=OFF
          -DMP_BUILD_TESTS=OFF
          -DMP_BUILD_VALIDATOR=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DMP_VEROVIO_CCACHE_DIR=${{ github.workspace }}/.ccache-verovio"
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Each bundle is there, holds a binary for the right machine, and on
      # Linux finds every library it links.
      - name: Check and package
        shell: bash
        run: |
          out=build/${{ matrix.preset }}/apps/MasterpiecePlugin/MasterpiecePlugin_artefacts/Release
          stage=dist/portable/Masterpiece-plugins
          mkdir -p "$stage"
          if [ "${{ runner.os }}" = macOS ]; then
            for b in AU/Masterpiece.component VST3/Masterpiece.vst3; do
              test -d "$out/$b" || { echo "not built: $b"; exit 1; }
              bin="$out/$b/Contents/MacOS/Masterpiece"
              file "$bin"
              file "$bin" | grep -q "${{ matrix.macarch }}"
              want=$(echo "${{ matrix.cmake_extra }}" | sed -n 's/.*DEPLOYMENT_TARGET=\([0-9.]*\).*/\1/p')
              got=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
              echo "oldest macOS: $got (wanted $want)"
              [ -z "$want" ] || [ "$got" = "$want" ] || { echo "$b asks for macOS $got"; exit 1; }
              cp -R "$out/$b" "$stage/"
            done
            ditto -c -k --keepParent "$stage" "dist/${{ matrix.artifact }}.zip"
            ls -lh dist
          else
            for kind in VST3 LV2; do
              b="$kind/Masterpiece.$(echo "$kind" | tr 'A-Z' 'a-z')"
              test -d "$out/$b" || { echo "not built: $b"; exit 1; }
              mkdir -p "$stage/$kind" && cp -R "$out/$b" "$stage/$kind/"
            done
            if [ "${{ runner.os }}" = Linux ]; then
              for so in $(find "$stage" -name '*.so'); do
                file "$so"
                if ldd "$so" | grep 'not found'; then exit 1; fi
              done
            fi
            find "$stage" -maxdepth 3 | sort
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.mac
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 3

      # A folder, as the Windows zip and the Linux tarballs of the program
      # are; the release packs it with the plugins folder at its top.
      - uses: actions/upload-artifact@v4
        if: '!matrix.mac'
        with:
          name: ${{ matrix.artifact }}
          path: dist/portable/
          if-no-files-found: error
          retention-days: 3

  # Linux as a Flatpak (discussion #237): one bundle for every distribution,
  # run in a sandbox. Built in the freedesktop SDK's own container from
  # packaging/flatpak; the bundle installs with "flatpak install".
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.bonninr.Masterpiece.yml
          bundle: masterpiece-linux-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          # Uploaded below, under the name the release looks for.
          upload-artifact: false

      - name: Check the bundle
        run: |
          test -s masterpiece-linux-x86_64.flatpak
          ls -l masterpiece-linux-x86_64.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: masterpiece-linux-x86_64-flatpak
          path: masterpiece-linux-x86_64.flatpak
          if-no-files-found: error
          retention-days: 3

  # iOS: the app for the simulator, unsigned. No release ships it yet, so a
  # tagged release skips it; on pull requests it keeps the iOS build honest.
  ios:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the runner: its simulators carry the newest iOS,
      # and the tap-through's idb needs a recent one.
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios
          echo "XCODE=$(xcodebuild -version | tr -d ' \n')" >> "$GITHUB_ENV"

      # Configuring for iOS took a quarter of an hour of every run: the
      # dependencies are fetched, and each of their feature checks is a build
      # of its own under the Xcode generator. What a configure leaves behind
      # is kept, so the next one finds its answers. Saved from main only, like
      # the compiler cache; a pull request restores main's.
      - name: Configure cache
        id: configure-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ios-sim/CMakeCache.txt
            build/ios-sim/CMakeFiles
            build/ios-sim/_deps
          key: ios-sim-configure-${{ env.XCODE }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', '**/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ios-sim

      - name: Save the configure cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.configure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ios-sim/CMakeCache.txt
            build/ios-sim/CMakeFiles
            build/ios-sim/_deps
          key: ${{ steps.configure-cache.outputs.cache-primary-key }}

      - name: Build
        run: >
          cmake --build build/ios-sim --config Release --target MasterpieceApp --
          -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO

      - name: Check output
        run: |
          APP=$(find build/ios-sim -name Masterpiece.app -type d | head -1)
          test -n "$APP" || { echo "no Masterpiece.app"; exit 1; }
          echo "$APP"
          lipo -info "$APP/Masterpiece"
          plutil -p "$APP/Info.plist" | grep -E "UIFileSharingEnabled|UIBackgroundModes|LSSupportsOpeningDocumentsInPlace" || true
          # The Bluetooth MIDI window ends an app without this key (#563).
          plutil -p "$APP/Info.plist" | grep NSBluetoothAlwaysUsageDescription || { echo "no Bluetooth usage description"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      # Run it, since nobody here has a Mac to look with. Organs made from
      # numbers (pure sine pipes, exponential releases), played from a MIDI
      # file and recorded inside the app, each recording checked against the
      # numbers; then the UI tapped through by the names on its buttons and a
      # package opened through the system's document picker. On a large iPad,
      # an iPad mini and an iPhone. See .github/ios-check/.
      - name: Tools for the simulator run
        run: |
          pip3 install --break-system-packages numpy fb-idb pytesseract pillow ocrmac || pip3 install numpy fb-idb pytesseract pillow ocrmac
          brew install tesseract
          brew tap facebook/fb && (brew trust facebook/fb || true) && brew install idb-companion || echo "idb-companion not available"

      - name: Test organs
        run: |
          python3 .github/ios-check/make_organ.py organs/check
          python3 .github/ios-check/make_organ.py organs/heavy --heavy
          du -sh organs/*/check.orgue

      # A pull request runs the large iPad, which also plays the heavy organ;
      # main runs all three. Three devices one after another were twenty
      # minutes of every pull request.
      - name: Run on each device
        env:
          MP_IOS_DEVICES: ${{ github.event_name == 'pull_request' && 'iPad Pro 13' || '' }}
        run: bash .github/ios-check/run_devices.sh "$APP" organs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: ios-shots/
          if-no-files-found: warn
          retention-days: 3

  # iOS for real iPhones and iPads: arm64, unsigned, packed as an .ipa for
  # sideloading. Apple runs nothing it has not signed, so the player signs it
  # with their own Apple ID through AltStore or Sideloadly; nothing here needs
  # a developer account. Built on release tags too, and published with them.
  ios-device:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # As in the simulator job: what a configure leaves behind is kept.
      - name: Xcode version
        run: echo "XCODE=$(xcodebuild -version | tr -d ' \n')" >> "$GITHUB_ENV"

      - name: Configure cache
        id: configure-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ios-sim/CMakeCache.txt
            build/ios-sim/CMakeFiles
            build/ios-sim/_deps
          key: ios-device-configure-${{ env.XCODE }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', '**/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ios-sim

      - name: Save the configure cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.configure-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/ios-sim/CMakeCache.txt
            build/ios-sim/CMakeFiles
            build/ios-sim/_deps
          key: ${{ steps.configure-cache.outputs.cache-primary-key }}

      - name: Build
        run: >
          cmake --build build/ios-sim --config Release --target MasterpieceApp --
          -sdk iphoneos -arch arm64
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # An .ipa is a ZIP with the app in a Payload folder.
      - name: Package
        run: |
          # Only the device build happens in this job, so there is one app.
          APP=$(find build/ios-sim -name Masterpiece.app -type d | head -1)
          test -n "$APP" || { echo "no Masterpiece.app"; exit 1; }
          echo "$APP"
          lipo -info "$APP/Masterpiece"
          # Platform 2 is iOS on a device; the simulator is 7.
          otool -l "$APP/Masterpiece" | grep -A4 "LC_BUILD_VERSION" | grep -q "platform 2" || { echo "not an iOS device binary"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry masterpiece-ios.ipa Payload
          ls -la masterpiece-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: masterpiece-ios
          path: masterpiece-ios.ipa
          if-no-files-found: error
          retention-days: 3

  # Android: the APK for phones, tablets and the emulator. Signed with the
  # release key from the repository's secrets when they are there (a fork's
  # pull request cannot read them, and gets the debug key); a release tag
  # will not publish an APK without it. The first step installs JUCE for the
  # runner itself (see android/README.md), which is what takes the time.
  android:
    runs-on: ubuntu-22.04
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      MP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sudo apt-get install -y ccache > /dev/null

      # Verovio's objects for both ABIs, kept as in the desktop jobs. Read by
      # its CMake file from the environment, which Gradle passes on.
      - name: Verovio compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache-verovio
          key: verovio-android-${{ hashFiles('cmake/MpVerovio.cmake', 'cmake/MpVerovioStubs.cpp') }}

      - name: Release key
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$MP_ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MP_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing with the release key"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "a release needs the release key (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD)"
            exit 1
          else
            echo "no release key here: signing with the debug key"
          fi

      - name: Build
        working-directory: android
        env:
          MP_VEROVIO_CCACHE_DIR: ${{ github.workspace }}/.ccache-verovio
        run: ./gradlew assembleRelease --no-daemon

      - name: Check output
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "no APK"; exit 1; }
          ls -la "$APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/libjuce_jni.so"

      # The App Bundle Google Play takes, signed with the same key. Kept as a
      # CI download for uploading to Play, not published on the release: a
      # phone cannot install a bundle directly.
      - name: Play bundle
        working-directory: android
        env:
          MP_VEROVIO_CCACHE_DIR: ${{ github.workspace }}/.ccache-verovio
        run: |
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Named for what it is: the release publishes it as it stands.
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk masterpiece-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: masterpiece-android
          path: masterpiece-android.apk
          if-no-files-found: error
          retention-days: 3
