name: build

# Four targets, all of them things a player might actually run this on:
# Windows, Linux x86-64, and a Raspberry Pi in either 64-bit (the default
# since 2022) or 32-bit form. macOS is written but deliberately not wired to
# any automatic trigger yet -- see the job at the bottom.
#
# On a public repository the standard runners cost nothing, so this no longer
# has to be shaped around a minute allowance; it is still kept from doing
# obviously wasted work, because a queue is a cost of its own.
on:
  push:
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYING'
      - 'LICENCE'
      - '.gitignore'
      - 'screenshots/**'
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also build macOS (bills at 10x)'
        type: boolean
        default: false

# Pushing twice in a minute should not pay for two builds of the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-linux
            artifact: masterpiece-linux-x86_64
          - os: windows-latest
            preset: ci-windows
            artifact: masterpiece-windows
          # The Pi, both ways round. arm64 is what a current Raspberry Pi OS
          # install actually is; armhf stays for older 32-bit installs.
          - os: ubuntu-latest
            preset: ci-linux-arm64
            artifact: masterpiece-linux-arm64
            arm: true
            debarch: arm64
            triple: aarch64-linux-gnu
          - os: ubuntu-latest
            preset: ci-linux-arm
            artifact: masterpiece-linux-armhf
            arm: true
            debarch: armhf
            triple: arm-linux-gnueabihf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # JUCE is recompiled from scratch otherwise, and it is the bulk of every
      # job. Keyed on the compiler and preset so a toolchain change does not
      # silently reuse objects built by a different one.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}-${{ matrix.os }}
          max-size: 500M

      - name: Dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev \
            libfontconfig1-dev libglu1-mesa-dev mesa-common-dev libxi-dev

      # In a script rather than inline, so the setup this job depends on can be
      # rehearsed off the runner. These two jobs produce a binary that cannot
      # be run here to check, which makes being able to reproduce them locally
      # worth more than it is for the native ones.
      - name: Dependencies (Linux -> ARM cross-build)
        if: runner.os == 'Linux' && matrix.arm
        # Invoked through bash rather than directly: the repository is worked
        # on from Windows, where the executable bit is not reliably carried.
        run: bash cmake/ci-arm-multiarch.sh ${{ matrix.debarch }} ${{ matrix.triple }}

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # A cross-built binary cannot run here, so confirm its machine type.
      - name: Check ARM output
        if: matrix.arm
        run: file build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Masterpiece

      - name: Launch check (Linux)
        if: runner.os == 'Linux' && !matrix.arm
        run: |
          sudo apt-get install -y xvfb
          APP=build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Masterpiece
          chmod +x "$APP"
          set +e
          timeout --signal=TERM 20s xvfb-run -a -s "-screen 0 1280x800x24" "$APP"
          code=$?
          set -e
          # 124 is the timeout firing, which means it was still running.
          test "$code" -eq 124

      - name: Launch check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/Release/Masterpiece.exe"
          if (-not (Test-Path $app)) { throw "not built: $app" }
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/apps/MasterpieceApp/MasterpieceApp_artefacts/**/*Masterpiece*
            build/${{ matrix.preset }}/apps/MasterpiecePlugin/**/*.vst3
            build/${{ matrix.preset }}/apps/MasterpiecePlugin/**/*.lv2
          if-no-files-found: warn

  # macOS is not a supported target yet: nothing here has been built or run on
  # one, so this job is wired to nothing automatic -- not even a release tag,
  # which would otherwise make a red build the first thing a tag produces. It
  # runs only when asked for by hand from the Actions tab, which is how the
  # port will be worked on when it starts.
  macos:
    if: inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-macos-macos-latest
          max-size: 500M

      - name: Dependencies
        run: brew install cmake ninja

      - name: Configure
        run: >
          cmake --preset ci-macos
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ci-macos

      - uses: actions/upload-artifact@v4
        with:
          name: masterpiece-macos
          path: |
            build/ci-macos/apps/MasterpieceApp/MasterpieceApp_artefacts/**/*Masterpiece*
            build/ci-macos/apps/MasterpiecePlugin/**/*.vst3
            build/ci-macos/apps/MasterpiecePlugin/**/*.component
          if-no-files-found: warn
