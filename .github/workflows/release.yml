name: release

# Tagging vX.Y.Z builds every supported target and publishes the binaries.
#
# The build matrix is not repeated here: this calls build.yml, so a release is
# produced by exactly the steps that verify an ordinary push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish'
        required: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One archive per target under a name that does not change between
      # releases, so releases/latest/download/<name> is a permanent link --
      # the README download badges point at exactly that.
      - name: Package
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for d in artifacts/*/; do
            name=$(basename "$d")
            # Already a finished package, published under its own name: the
            # macOS zips (packed on the Mac, since a .app loses its executable
            # bit as loose files), the Windows setup program and the .debs.
            # Named jobs rather than "one file inside", which would also catch
            # a loose-file artifact that happened to hold a single binary and
            # publish that instead of the archive people are linked to.
            case "$name" in
              masterpiece-windows-setup|*-deb|masterpiece-macos-*)
                f=$(ls "$d")
                test "$(ls "$d" | wc -l)" = 1 || { echo "$name: expected one file, found:"; ls "$d"; exit 1; }
                cp "$d/$f" "dist/$f"
                continue ;;
            esac
            case "$name" in
              masterpiece-windows) ext=zip ;;
              *)                   ext=tar.gz ;;
            esac
            if [ "$ext" = zip ]; then
              (cd "$d" && zip -qr "../../dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$d" .
            fi
          done
          # Every package a second time with the version in its name, so a
          # player can tell from the file alone which build they have. The
          # unversioned names stay: releases/latest/download/<name> is what the
          # README badges link to, and those links must not move.
          ver="${tag#v}"
          for b in $(ls dist); do
            case "$b" in
              masterpiece-*) cp "dist/$b" "dist/masterpiece-${ver}-${b#masterpiece-}" ;;
            esac
          done
          ls -lh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$tag" dist/* \
            --title "Masterpiece $tag" \
            --generate-notes \
            --verify-tag || gh release upload "$tag" dist/* --clobber
