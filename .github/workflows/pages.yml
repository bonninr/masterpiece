name: pages

# The project page lives in site/. GitHub Pages can only serve a branch root
# or /docs, and /docs in this repository is the internal documentation tree,
# so the page is published by this workflow instead of by branch setting.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is dropped rather than cancelled
# mid-publish, which would leave the site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The demonstration recording is a release asset, not a file in git: it
      # is 66 MB and is replaced whenever the programme changes, which is not
      # something history should carry a copy of each time. It is fetched here
      # so that Pages serves it as video/mp4 -- release assets are served as
      # application/octet-stream, and a browser picks its decoder from the
      # media type, so a <video> pointed straight at the asset will not play.
      - name: Fetch the demonstration recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The recording is not rebuilt for every release, so "latest" is not
          # where it necessarily lives. Take the newest release that actually
          # carries it; a release without it must not blank the video.
          tag=$(gh release list --limit 30 --json tagName -q '.[].tagName' | while read -r t; do
            if gh release view "$t" --json assets -q '.assets[].name' | grep -qx 'masterpiece-recital.mp4'; then
              echo "$t"; break
            fi
          done)
          if [ -n "$tag" ]; then
            echo "recording comes from $tag"
            gh release download "$tag" --pattern 'masterpiece-recital.mp4' --output site/recital.mp4
          else
            echo "no release carries the recording; the page will link out instead"
          fi
          ls -lh site/recital.mp4 || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
