name: pages

# The project page lives in site/. GitHub Pages can only serve a branch root
# or /docs, and /docs in this repository is the internal documentation tree,
# so the page is published by this workflow instead of by branch setting.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'manual/**'
      - '.github/workflows/pages.yml'
      - '.github/pages-downloads.py'
  # The download links follow the latest release. release.yml runs this
  # workflow after it publishes, since a release its own token creates
  # starts no other workflow; this covers one published by hand.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is dropped rather than cancelled
# mid-publish, which would leave the site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The demonstration recording is a release asset, not a file in git: it
      # is 66 MB and is replaced whenever the programme changes, which is not
      # something history should carry a copy of each time. It is fetched here
      # so that Pages serves it as video/mp4 -- release assets are served as
      # application/octet-stream, and a browser picks its decoder from the
      # media type, so a <video> pointed straight at the asset will not play.
      - name: Fetch the recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The recordings are not rebuilt for every release, so "latest" is
          # not where they necessarily live. For each, take the newest release
          # that actually carries it; a release without it must not blank the
          # video.
          fetch () {  # asset name on the release | file name on the site
            local asset="$1" out="$2" tag
            tag=$(gh release list --limit 30 --json tagName -q '.[].tagName' | while read -r t; do
              if gh release view "$t" --json assets -q '.assets[].name' | grep -qx "$asset"; then
                echo "$t"; break
              fi
            done)
            if [ -n "$tag" ]; then
              echo "$asset comes from $tag"
              gh release download "$tag" --pattern "$asset" --output "site/$out"
            else
              echo "no release carries $asset; the page will link out instead"
            fi
          }
          fetch masterpiece-recital.mp4 recital.mp4
          fetch masterpiece-recital-2.mp4 recital-2.mp4
          ls -lh site/*.mp4 || true

      - name: Point the download links at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pages-downloads.py site

      # The manual is an mdBook in manual/, served at /docs. The tool is the
      # release binary of a fixed version, checked against its checksum.
      - name: Build the manual
        env:
          MDBOOK: v0.5.4
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          archive="mdbook-$MDBOOK-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK/$archive"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/mdbook" build manual --dest-dir ../site/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
