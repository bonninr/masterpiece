name: packaging

# Builds the store packages in packaging/ to check they still build: by hand
# from the Actions tab, and on any pull request that changes them. Nothing
# here publishes anything.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: packaging/flatpak/io.github.bonninr.Masterpiece.yml
          bundle: masterpiece.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Check the metadata
        run: appstreamcli validate --no-net packaging/io.github.bonninr.Masterpiece.metainfo.xml || true

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # snapcraft looks for snap/snapcraft.yaml at the project's top.
      - run: mkdir -p snap && cp packaging/snap/snapcraft.yaml snap/
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: masterpiece-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 3
