# Masterpiece as a Flatpak, built in CI (build.yml, job "flatpak").
#
# Built from the checkout it sits in. The build fetches JUCE and the other
# libraries over the network as every other build does (FetchContent), which
# a CI build allows; a Flathub submission will need them listed as sources.
app-id: io.github.bonninr.Masterpiece
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: masterpiece
rename-desktop-file: masterpiece.desktop
rename-icon: masterpiece
finish-args:
  - --share=ipc
  - --socket=x11
  # Sound through PulseAudio or PipeWire, and JACK through PipeWire's socket.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # ALSA audio and MIDI devices: organ consoles are USB MIDI keyboards.
  - --device=all
  # Sample sets are large and live wherever the player keeps them: the home
  # folder, a second disk, a USB drive.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
modules:
  # JUCE's JACK backend needs <jack/jack.h> to compile and opens libjack
  # itself at run time, so the headers are all it takes from JACK.
  - name: jack-headers
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/include/jack common/jack/*.h
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/jackaudio/jack2/archive/refs/tags/v1.9.22.tar.gz
        sha256: 1e42b9fc4ad7db7befd414d45ab2f8a159c0b30fcd6eee452be662298766a849

  - name: masterpiece
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DMP_BUILD_PLUGIN=OFF
      - -DMP_BUILD_TESTS=OFF
      - -DMP_BUILD_VALIDATOR=OFF
    build-options:
      cxxflags: -I/app/include
      build-args:
        - --share=network
    post-install:
      - install -Dm644 -t /app/share/metainfo /run/build/masterpiece/packaging/flatpak/io.github.bonninr.Masterpiece.metainfo.xml
      # Shared MIME files are exported under the app's own name.
      - mv /app/share/mime/packages/masterpiece.xml /app/share/mime/packages/io.github.bonninr.Masterpiece.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - android
          - .git
